l shift in professional tennis.',k:['Teen champion','Record breaker','New generation'],u:'https://techstartups.com',t:'2d',r:'3m'},{c:'Business',h:'🛍️ E-commerce Evolution: AR Shopping Goes Mainstream!',s:'Augmented reality transforms online shopping experience.',d:'Virtual try-ons reduce returns and increase customer satisfaction.',k:['AR shopping','Virtual try-on','Return reduction'],u:'https://techstartups.com',t:'2d',r:'4m'},{c:'Technology',h:'🎮 VR Gaming Boom: Meta Quest 4 Breaks Sales Records!',s:'Latest VR headset sells 5 million units in first month.',d:'Improved comfort and content library drive mainstream adoption.',k:['VR sales','Quest 4','Mainstream adoption'],u:'https://techcrunch.com',t:'2d',r:'3m'}];let allNews=newsData,idx=0,cnt=0,streak=0,bm=JSON.parse(localStorage.getItem('bm')||'[]'),stats=JSON.parse(localStorage.getItem('stats')||'{}'),drag=false,sx=0,cx=0,cc=null,currentFilter='All',isDark=localStorage.getItem('dark')==='true';const categories=['All','Technology','Politics','Business','Sports','Health','World','Environment','Science','Entertainment','Education','Space'];function init(){if(isDark){document.body.classList.add('dark');document.getElementById('theme').textContent='☀️';}loadStats();updateDisplay();renderFilters();load();setupEvents();}function loadStats(){cnt=parseInt(localStorage.getItem('cnt')||'0');streak=parseInt(localStorage.getItem('streak')||'0');const lastDate=localStorage.getItem('lastDate');const today=new Date().toDateString();if(lastDate===today){streak=parseInt(localStorage.getItem('streak')||'0');}else if(lastDate){const last=new Date(lastDate);const diff=Math.floor((new Date()-last)/(1000*60*60*24));if(diff===1){streak++;}else if(diff>1){streak=1;}}else{streak=1;}localStorage.setItem('streak',streak);localStorage.setItem('lastDate',today);}function updateDisplay(){document.getElementById('count').textContent=cnt;document.getElementById('streak').textContent=streak;}function renderFilters(){const container=document.getElementById('filters');container.innerHTML=categories.map(c=>`<button class="filter-btn ${c===currentFilter?'active':''}" onclick="filterNews('${c}')">${c}</button>`).join('');}window.filterNews=function(cat){currentFilter=cat;if(cat==='All'){allNews=newsData;}else{allNews=newsData.filter(n=>n.c===cat);}idx=0;renderFilters();load();};function load(){const st=document.getElementById('stack');st.innerHTML='';for(let i=0;i<3;i++){const newsIndex=(idx+i)%allNews.length;const n=allNews[newsIndex];const c=document.createElement('div');c.className='card';c.style.transform=`translateY(${i*10}px) scale(${1-i*.05})`;c.style.zIndex=100-i;c.innerHTML=`<div class="header"><div class="badge">${n.c}</div><h2 class="headline">${n.h}</h2><div class="meta"><span>⏰ ${n.t}</span><span>📖 ${n.r}</span></div></div><div class="body"><div class="summary">${n.s}</div><div class="details" id="d${i}"><p>${n.d}</p><ul>${n.k.map(k=>`<li>✓ ${k}</li>`).join('')}</ul></div></div><div class="footer"><button class="expand" onclick="tog(${i})"><span id="t${i}">📖 Read More</span></button><a class="source" href="${n.u}" target="_blank">🔗 Source</a></div>`;st.appendChild(c);}cc=st.children[0];cc.onmousedown=cc.ontouchstart=ds;}window.tog=i=>{const d=document.getElementById('d'+i),t=document.getElementById('t'+i);d.classList.toggle('show');t.textContent=d.classList.contains('show')?'📕 Show Less':'📖 Read More';};function ds(e){if(e.target.closest('.expand')||e.target.closest('.source'))return;drag=true;sx=e.type==='mousedown'?e.clientX:e.touches[0].clientX;document.onmousemove=document.ontouchmove=dm;document.onmouseup=document.ontouchend=de;}function dm(e){if(!drag)return;cx=e.type==='mousemove'?e.clientX:e.touches[0].clientX;const dx=cx-sx;cc.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;cc.style.transition='none';const l=document.querySelector('.ind.left'),r=document.querySelector('.ind.right');if(dx<-50){l.classList.add('show');r.classList.remove('show');}else if(dx>50){r.classList.add('show');l.classList.remove('show');}else{l.classList.remove('show');r.classList.remove('show');}}function de(){if(!drag)return;drag=false;const dx=cx-sx;document.onmousemove=document.ontouchmove=document.onmouseup=document.ontouchend=null;document.querySelector('.ind.left').classList.remove('show');document.querySelector('.ind.right').classList.remove('show');if(Math.abs(dx)>100){dx<0?skip():save();}else{cc.style.transform='';cc.style.transition='transform .3s';}}function skip(){cc.style.transform='translateX(-1000px) rotate(-50deg)';cc.style.transition='transform .5s';cc.style.opacity='0';next();}function save(){const n=allNews[idx%allNews.length];if(!bm.find(b=>b.h===n.h)){bm.push(n);localStorage.setItem('bm',JSON.stringify(bm));toast('📚 Saved to bookmarks!');}cc.style.transform='translateX(1000px) rotate(50deg)';cc.style.transition='transform .5s';cc.style.opacity='0';next();}function next(){cnt++;localStorage.setItem('cnt',cnt);updateDisplay();checkAchievements();setTimeout(()=>{idx++;load();},500);}function checkAchievements(){if(cnt===10){toast('🎉 Achievement: News Explorer!');confetti();}else if(cnt===50){toast('🏆 Achievement: News Junkie!');confetti();}else if(cnt===100){toast('👑 Achievement: News Master!');confetti();}if(streak===7){toast('🔥 7 Day Streak! You\'re on fire!');confetti();}}function confetti(){for(let i=0;i<50;i++){setTimeout(()=>{const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#667eea','#764ba2','#ff4757','#2ed573','#ffd700'][Math.floor(Math.random()*5)];document.body.appendChild(c);setTimeout(()=>c.remove(),3000);},i*30);}}function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}function setupEvents(){document.getElementById('skip').onclick=skip;document.getElementById('save').onclick=save;document.getElementById('info').onclick=()=>toast('👈 Swipe left to skip • 👉 Swipe right to save');document.getElementById('saved').onclick=showBookmarks;document.getElementById('stats').onclick=showStats;document.getElementById('theme').onclick=toggleTheme;document.getElementById('share').onclick=shareApp;document.getElementById('closeBookmarks').onclick=()=>document.getElementById('bookmarksModal').classList.remove('show');document.getElementById('closeStats').onclick=()=>document.getElementById('statsModal').classList.remove('show');}function toggleTheme(){isDark=!isDark;document.body.classList.toggle('dark');document.getElementById('theme').textContent=isDark?'☀️':'🌙';localStorage.setItem('dark',isDark);}function showBookmarks(){const modal=document.getElementById('bookmarksModal');const list=document.getElementById('bookmarks');if(bm.length===0){list.innerHTML='<div class="empty"><div>📚</div><p>No saved articles yet!</p><p style="font-size:14px;margin-top:10px">Swipe right to save articles</p></div>';}else{list.innerHTML=bm.map((n,i)=>`<div class="bookmark-item" onclick="openBm(${i})"><h3>${n.h}</h3><p>${n.c} • ${n.t}</p></div>`).join('');}modal.classList.add('show');}function showStats(){const modal=document.getElementById('statsModal');const content=document.getElementById('statsContent');const avgPerDay=cnt/(streak||1);const achievements=[];if(cnt>=10)achievements.push('🎉 News Explorer');if(cnt>=50)achievements.push('🏆 News Junkie');if(cnt>=100)achievements.push('👑 News Master');if(streak>=7)achievements.push('🔥 Week Warrior');if(streak>=30)achievements.push('💪 Month Master');content.innerHTML=`<div class="stat-item"><div class="big">${cnt}</div><div class="label">Articles Read</div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(cnt,100)}%"></div></div></div><div class="stat-item"><div class="big">${streak}</div><div class="label">Day Streak 🔥</div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(streak*3.33,100)}%"></div></div></div><div class="stat-item"><div class="big">${bm.length}</div><div class="label">Saved Articles</div></div><div class="stat-item"><div class="big">${avgPerDay.toFixed(1)}</div><div class="label">Avg Per Day</div></div>${achievements.length>0?`<div class="achievement">🏆 Achievements<br>${achievements.join(' • ')}</div>`:''}<button class="share-btn" onclick="shareStats()">📤 Share Your Stats</button>`;modal.classList.add('show');}function shareStats(){if(navigator.share){navigator.share({title:'My NewsFlash Stats',text:`I've read ${cnt} articles with a ${streak} day streak on NewsFlash! 🔥`,url:window.location.href}).catch(()=>{});}else{toast('📋 Stats: '+cnt+' articles, '+streak+' day streak!');}}function shareApp(){if(navigator.share){navigator.share({title:'NewsFlash - Swipe Through News',text:'Check out NewsFlash! Swipe through the latest news headlines.',url:window.location.href}).catch(()=>{});}else{toast('📋 Share this link with friends!');}}window.openBm=i=>{window.open(bm[i].u,'_blank');};init();
  </script>
