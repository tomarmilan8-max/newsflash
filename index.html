<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsFlash - Swipe Through Today's Headlines</title>
  <style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;overflow:hidden}.app{max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:20px}header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:rgba(255,255,255,.95);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.1);margin-bottom:20px}.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.logo-icon{font-size:28px;animation:pulse 2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.stats{display:flex;gap:15px;align-items:center;font-size:14px;font-weight:600;color:#555}#saved{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;transition:transform .2s}#saved:hover{transform:scale(1.05)}main{flex:1;position:relative;display:flex;align-items:center;justify-content:center}#stack{position:relative;width:100%;height:500px}.card{position:absolute;width:100%;height:100%;background:white;border-radius:25px;box-shadow:0 10px 40px rgba(0,0,0,.2);cursor:grab;overflow:hidden;transition:transform .3s}.card:active{cursor:grabbing}.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;color:white}.badge{display:inline-block;background:rgba(255,255,255,.3);padding:5px 12px;border-radius:15px;font-size:12px;font-weight:600;margin-bottom:10px;text-transform:uppercase}.headline{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:10px}.meta{font-size:13px;opacity:.9}.body{padding:25px;height:calc(100% - 180px);overflow-y:auto}.summary{font-size:16px;line-height:1.6;color:#333;margin-bottom:20px}.details{max-height:0;overflow:hidden;transition:max-height .5s}.details.show{max-height:1000px}.details p{font-size:15px;line-height:1.6;color:#555;margin-bottom:15px}.details ul{margin-left:20px;line-height:1.8}.footer{padding:20px 25px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.expand{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:12px 24px;border-radius:25px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .2s}.expand:hover{transform:scale(1.05)}.source{color:#667eea;text-decoration:none;font-weight:600;font-size:14px}.source:hover{text-decoration:underline}.indicators{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;z-index:10}.ind{background:rgba(255,255,255,.9);padding:15px 25px;border-radius:20px;font-weight:700;font-size:18px;opacity:0;transform:scale(.8);transition:all .3s;box-shadow:0 5px 20px rgba(0,0,0,.2)}.ind.show{opacity:1;transform:scale(1)}.ind.left{color:#ff4757}.ind.right{color:#2ed573}.controls{display:flex;justify-content:center;gap:20px;padding:20px;background:rgba(255,255,255,.95);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.1);margin-top:20px}.controls button{width:60px;height:60px;border-radius:50%;border:none;font-size:24px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(0,0,0,.1)}.controls button:hover{transform:translateY(-3px)}#skip{background:linear-gradient(135deg,#ff4757,#ff6348);color:white}#info{background:linear-gradient(135deg,#667eea,#764ba2);color:white}#save{background:linear-gradient(135deg,#2ed573,#26de81);color:white}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-content{background:white;border-radius:25px;max-width:500px;width:100%;max-height:80vh;overflow:hidden}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 25px;border-bottom:1px solid #eee}.modal-header h2{font-size:22px;color:#333}.close-btn{background:none;border:none;font-size:28px;cursor:pointer;color:#999;transition:color .2s}.close-btn:hover{color:#333}.bookmarks-list{padding:20px;overflow-y:auto;max-height:60vh}.bookmark-item{background:#f8f9fa;padding:15px;border-radius:15px;margin-bottom:15px;cursor:pointer;transition:transform .2s}.bookmark-item:hover{transform:translateX(5px)}.bookmark-item h3{font-size:16px;color:#333;margin-bottom:5px}.bookmark-item p{font-size:13px;color:#666}.empty{text-align:center;padding:40px 20px;color:#999}.empty div{font-size:60px;margin-bottom:10px}@media(max-width:600px){.app{padding:10px}.headline{font-size:20px}#stack{height:450px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo"><span class="logo-icon">⚡</span> NewsFlash</div>
      <div class="stats">
        <span>📰 <span id="count">0</span> read</span>
        <button id="saved">🔖 Saved</button>
      </div>
    </header>
    <main>
      <div id="stack"></div>
      <div class="indicators">
        <div class="ind left">👎 Skip</div>
        <div class="ind right">📖 Read Later</div>
      </div>
    </main>
    <div class="controls">
      <button id="skip">✖</button>
      <button id="info">ℹ️</button>
      <button id="save">💾</button>
    </div>
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>📚 Saved Articles</h2>
          <button class="close-btn" id="close">✕</button>
        </div>
        <div class="bookmarks-list" id="bookmarks"></div>
      </div>
    </div>
  </div>
  <script>
const news=[{c:'Politics',h:'🚨 BREAKING: Maduro Captured - Venezuela\'s Political Earthquake!',s:'In a stunning turn of events, Venezuelan leader Nicolás Maduro has been captured, sending shockwaves through international politics and sparking intense debate about the country\'s future.',d:'The capture marks a pivotal moment in Venezuelan history, with implications for regional stability and international relations. World leaders are closely monitoring the situation as the country faces an uncertain political transition.',k:['International community divided on response','Regional stability concerns mounting','Future of Venezuelan democracy uncertain'],u:'https://www.ndtv.com/education/school-assembly-news-headlines-january-11-2026',t:'2h ago',r:'3 min'},{c:'Technology',h:'⚠️ AI Scams Explode: Your Voice Could Be Cloned Right Now!',s:'AI-powered voice cloning scams are surging globally, with criminals using sophisticated technology to impersonate victims\' loved ones and steal millions.',d:'Security experts warn that AI voice cloning technology has become so advanced that scammers can replicate anyone\'s voice with just a few seconds of audio. The technology is being used in elaborate schemes targeting vulnerable individuals.',k:['Voice cloning requires only 3-5 seconds of audio','Elderly population particularly vulnerable','New security measures being developed'],u:'https://www.ndtv.com/education/school-assembly-news-headlines-january-11-2026',t:'4h ago',r:'4 min'},{c:'Economy',h:'💰 Massive Fraud Exposed: Billions in Federal Funds Vanish!',s:'A Government Accountability Office report reveals systemic failures in ACA marketplaces, with billions in federal funds lost to fraud in healthcare and child-care programs.',d:'The investigation uncovered widespread fraud across multiple federal programs, particularly in Minnesota\'s child-care system and Affordable Care Act marketplaces. The scale of the fraud has prompted calls for immediate reform and stricter oversight.',k:['Billions lost in healthcare fraud schemes','Minnesota child-care program heavily affected','Congressional hearings scheduled'],u:'https://www.youtube.com/watch?v=LRWbggpTSUc',t:'5h ago',r:'5 min'},{c:'Sports',h:'🏏 Cricket Drama: Kohli Retirement Rumors Rock Indian Team!',s:'Speculation intensifies around Virat Kohli\'s potential retirement as India faces crucial T20 World Cup decisions. Meanwhile, rising star Vaibhav Suryavanshi captures attention.',d:'The cricket world is abuzz with discussions about Kohli\'s future, while young talent Vaibhav Suryavanshi emerges as a potential successor. The T20 World Cup venue dispute adds another layer of complexity to India\'s cricket landscape.',k:['Kohli\'s future remains uncertain','Suryavanshi shows exceptional promise','T20 World Cup venue under debate'],u:'https://www.ndtv.com/education/school-assembly-news-headlines-january-11-2026',t:'6h ago',r:'3 min'},{c:'International',h:'🌍 US-Russia Tensions Escalate: Putin Policy Under Fire!',s:'Heated debates over US policy toward Russia and Vladimir Putin intensify as geopolitical tensions reach new heights, with implications for global security.',d:'The international community watches closely as US-Russia relations deteriorate further. Policy experts warn of potential consequences for global stability, while diplomatic channels remain strained.',k:['Diplomatic relations at historic low','NATO allies coordinating response','Economic sanctions under review'],u:'https://www.ndtv.com/education/school-assembly-news-headlines-january-11-2026',t:'7h ago',r:'4 min'},{c:'Technology',h:'🤖 AI Revolution: Video Generators & AI Agents Transform Industries!',s:'Explosive growth in AI tools including video generators, AI agents, and educational AI is reshaping how we work, create, and learn in 2026.',d:'The AI industry is experiencing unprecedented growth with new applications emerging daily. From AI video generators creating Hollywood-quality content to AI agents automating complex tasks, the technology is revolutionizing multiple sectors.',k:['AI video generation reaches new quality levels','Educational AI tools gaining widespread adoption','AI agents automating business processes'],u:'https://explodingtopics.com/blog/trending-topics',t:'8h ago',r:'5 min'}];let idx=0,cnt=0,bm=JSON.parse(localStorage.getItem('bm')||'[]'),drag=false,sx=0,cx=0,cc=null;function init(){document.getElementById('count').textContent=cnt;load();document.getElementById('skip').onclick=skip;document.getElementById('save').onclick=save;document.getElementById('info').onclick=()=>alert('NewsFlash - Swipe through the latest news!\\n\\n👈 Swipe left to skip\\n👉 Swipe right to save\\n📖 Click "Read Full Story" for details\\n🔗 Click "Source" to read original');document.getElementById('saved').onclick=showBookmarks;document.getElementById('close').onclick=hideBookmarks;}function load(){const st=document.getElementById('stack');st.innerHTML='';for(let i=0;i<3;i++){const n=news[(idx+i)%news.length];const c=document.createElement('div');c.className='card';c.style.transform=`translateY(${i*10}px) scale(${1-i*.05})`;c.style.zIndex=100-i;c.innerHTML=`<div class="header"><div class="badge">${n.c}</div><h2 class="headline">${n.h}</h2><div class="meta">⏰ ${n.t} • 📖 ${n.r}</div></div><div class="body"><div class="summary">${n.s}</div><div class="details" id="d${i}"><p>${n.d}</p><ul>${n.k.map(k=>`<li>✓ ${k}</li>`).join('')}</ul></div></div><div class="footer"><button class="expand" onclick="tog(${i})"><span id="t${i}">📖 Read Full Story</span></button><a class="source" href="${n.u}" target="_blank">🔗 Source</a></div>`;st.appendChild(c);}cc=st.children[0];cc.onmousedown=cc.ontouchstart=ds;}window.tog=i=>{const d=document.getElementById('d'+i),t=document.getElementById('t'+i);d.classList.toggle('show');t.textContent=d.classList.contains('show')?'📕 Show Less':'📖 Read Full Story';};function ds(e){if(e.target.closest('.expand')||e.target.closest('.source'))return;drag=true;sx=e.type==='mousedown'?e.clientX:e.touches[0].clientX;document.onmousemove=document.ontouchmove=dm;document.onmouseup=document.ontouchend=de;}function dm(e){if(!drag)return;cx=e.type==='mousemove'?e.clientX:e.touches[0].clientX;const dx=cx-sx;cc.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;cc.style.transition='none';const l=document.querySelector('.ind.left'),r=document.querySelector('.ind.right');if(dx<-50){l.classList.add('show');r.classList.remove('show');}else if(dx>50){r.classList.add('show');l.classList.remove('show');}else{l.classList.remove('show');r.classList.remove('show');}}function de(){if(!drag)return;drag=false;const dx=cx-sx;document.onmousemove=document.ontouchmove=document.onmouseup=document.ontouchend=null;document.querySelector('.ind.left').classList.remove('show');document.querySelector('.ind.right').classList.remove('show');if(Math.abs(dx)>100){dx<0?skip():save();}else{cc.style.transform='';cc.style.transition='transform .3s';}}function skip(){cc.style.transform='translateX(-1000px) rotate(-50deg)';cc.style.transition='transform .5s';cc.style.opacity='0';next();}function save(){const n=news[idx%news.length];if(!bm.find(b=>b.h===n.h)){bm.push(n);localStorage.setItem('bm',JSON.stringify(bm));showNotif('📚 Saved to bookmarks!');}cc.style.transform='translateX(1000px) rotate(50deg)';cc.style.transition='transform .5s';cc.style.opacity='0';next();}function next(){cnt++;document.getElementById('count').textContent=cnt;setTimeout(()=>{idx++;load();},500);}function showNotif(msg){const n=document.createElement('div');n.style.cssText='position:fixed;top:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:white;padding:15px 30px;border-radius:25px;font-weight:600;z-index:2000';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2000);}function showBookmarks(){const modal=document.getElementById('modal');const list=document.getElementById('bookmarks');if(bm.length===0){list.innerHTML='<div class="empty"><div>📚</div><p>No saved articles yet!</p><p style="font-size:14px;margin-top:10px">Swipe right on cards to save them</p></div>';}else{list.innerHTML=bm.map((n,i)=>`<div class="bookmark-item" onclick="openBm(${i})"><h3>${n.h}</h3><p>${n.c} • ${n.t}</p></div>`).join('');}modal.classList.add('show');}function hideBookmarks(){document.getElementById('modal').classList.remove('show');}window.openBm=i=>{window.open(bm[i].u,'_blank');};init();
  </script>
</body>
</html>
